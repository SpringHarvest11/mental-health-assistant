server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  #MySQL数据库连接（database:mental_health_assistant），具体值由 profile 文件提供
  datasource:
    driver-class-name: ${nie.datasource.driver-class-name}
    url: jdbc:mysql://${nie.datasource.host}:${nie.datasource.port}/${nie.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${nie.datasource.username}
    password: ${nie.datasource.password}
    #HikariCP 连接池（Spring Boot 默认连接池）
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis
  data:
    redis:
      timeout: 2000ms
      host: ${nie.redis.host}
      port: ${nie.redis.port}
      password: ${nie.redis.password}
      database: ${nie.redis.database}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  #Spring AI
  ai:
    model:
      chat: deepseek
    #Redis 对话记忆（依赖 Redis Stack / Redis 8 的 RedisJSON + Query Engine）
    chat:
      memory:
        repository:
          redis:
            host: ${nie.redis.host}
            port: ${nie.redis.port}
            password: ${nie.redis.password}
            time-to-live: 7d
            max-messages-per-conversation: 30
    deepseek:
      api-key: ${nie.deepseek.api-key}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        temperature: 0.7

mybatis:
  #开启驼峰命名映射
  configuration:
    map-underscore-to-camel-case: true
  #xml文件路径映射
  mapper-locations: classpath:mapper/**/*.xml

jwt:
  secret: ${nie.jwt.secret}
  expiration: ${nie.jwt.expiration}

